name: Update IPTV Master Playlist

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      skip_validation:
        description: "Skip stream validation for a faster run"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: iptv-master-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build master playlist
        env:
          SKIP_VALIDATION: ${{ inputs.skip_validation && 'true' || 'false' }}
          PROXY_BASE_URL: ${{ vars.PROXY_BASE_URL }}
        run: python update.py

      - name: Commit and push changes
        run: |
          git config user.name "iptv-master-bot"
          git config user.email "iptv-master-bot@users.noreply.github.com"
          git add -A -- master.m3u channels.json failed_sources.json
          if [ -f master_failover.m3u ]; then git add master_failover.m3u; fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update master playlist $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
